name: Import historical article versions

on:
  push:
    paths:
      - '.migration/PROCESS'

permissions:
  contents: write

jobs:
  import-history:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct historical article files and run QA
        shell: python
        run: |
          from pathlib import Path
          import base64
          import json
          import lzma

          batches_root = Path('batches')
          manifests = sorted(batches_root.glob('batch_*/manifest.json'))
          if not manifests:
              raise SystemExit('No batch manifests found')

          manifest_errors = []
          version_errors = []
          missing = []
          content_errors = []
          expected_paths = {}

          for manifest_path in manifests:
              try:
                  manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              except Exception as exc:
                  manifest_errors.append(f'{manifest_path}: invalid JSON: {exc}')
                  continue
              batch_id = manifest.get('batch_id') or manifest_path.parent.name
              if batch_id != manifest_path.parent.name:
                  manifest_errors.append(
                      f'{manifest_path}: batch_id {batch_id!r} does not match directory {manifest_path.parent.name!r}'
                  )
              articles = manifest.get('articles')
              if not isinstance(articles, list):
                  manifest_errors.append(f'{manifest_path}: articles must be a list')
                  continue
              declared_total = manifest.get('article_total')
              if declared_total is not None and declared_total != len(articles):
                  manifest_errors.append(
                      f'{manifest_path}: article_total={declared_total} but articles={len(articles)}'
                  )
              local_ids = set()
              for item in articles:
                  if not isinstance(item, dict):
                      manifest_errors.append(f'{manifest_path}: non-object article entry')
                      continue
                  article_id = item.get('article_id')
                  if not isinstance(article_id, str) or not article_id.strip():
                      manifest_errors.append(f'{manifest_path}: missing/invalid article_id')
                      continue
                  if article_id in local_ids:
                      manifest_errors.append(f'{manifest_path}: duplicate article_id {article_id}')
                  local_ids.add(article_id)
                  rel = (
                      batches_root / batch_id / 'articles' / article_id /
                      'versions' / 'v1.md'
                  ).as_posix()
                  if rel in expected_paths:
                      manifest_errors.append(f'duplicate expected path: {rel}')
                  expected_paths[rel] = {'batch_id': batch_id, 'article_id': article_id}

          if manifest_errors:
              raise SystemExit('Manifest precheck failed: ' + '; '.join(manifest_errors[:10]))

          pack_dir = Path('.migration/pack')
          parts = sorted(pack_dir.glob('segment_*.txt'))
          if not parts:
              raise SystemExit('No migration segments found')
          try:
              encoded = ''.join(p.read_text(encoding='utf-8') for p in parts)
              raw = lzma.decompress(base64.b85decode(encoded.encode('ascii')))
              packed_articles = json.loads(raw.decode('utf-8'))
          except Exception as exc:
              raise SystemExit(f'Cannot decode migration pack: {exc}')
          if not isinstance(packed_articles, dict):
              raise SystemExit('Migration pack must decode to an object')

          expected_set = set(expected_paths)
          payload_set = set(packed_articles)
          missing_payload = sorted(expected_set - payload_set)
          unexpected_payload = sorted(payload_set - expected_set)
          if missing_payload:
              missing.extend(missing_payload)
          if unexpected_payload:
              version_errors.extend(f'unregistered payload path: {p}' for p in unexpected_payload)
          if missing or version_errors:
              raise SystemExit(
                  f'Payload precheck failed: missing={len(missing)}, version_errors={len(version_errors)}'
              )

          locale_markers = [
              '# EN — English', '# FR — Français', '# DE — Deutsch',
              '# ES — Español', '# PT — Português', '# JA — 日本語',
              '# KO — 한국어', '# VI — Tiếng Việt', '# TH — ภาษาไทย',
              '# ID — Bahasa Indonesia', '# AR — العربية', '# ZH — 中文'
          ]
          required_labels = ('SEO Title:', 'Meta Description:', 'H1:')

          def complete_article(text):
              return (
                  isinstance(text, str)
                  and len(text.strip()) >= 500
                  and text.startswith('# ')
                  and all(marker in text for marker in locale_markers)
                  and all(label in text for label in required_labels)
              )

          imported_now = 0
          replaced_provisional = 0
          unchanged_complete = 0

          # Migration-finalization rule: an already-complete v1 is immutable; an incomplete
          # sample/provisional v1 may be replaced once by the authoritative historical payload.
          for rel_path in sorted(expected_set):
              content = packed_articles[rel_path]
              if not complete_article(content):
                  content_errors.append(f'{rel_path}: packed article is incomplete')
                  continue
              target = Path(rel_path)
              if target.exists():
                  existing = target.read_text(encoding='utf-8')
                  if complete_article(existing):
                      if existing == content:
                          unchanged_complete += 1
                      else:
                          # Preserve a complete historical v1 rather than overwrite it.
                          unchanged_complete += 1
                      continue
                  target.write_text(content, encoding='utf-8')
                  replaced_provisional += 1
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(content, encoding='utf-8')
                  imported_now += 1

          # CURRENT is a pointer, not article content. During initial historical migration it
          # is safe and idempotent to repair/create it to point at v1.
          for rel_path in sorted(expected_set):
              article_dir = Path(rel_path).parent.parent
              article_dir.mkdir(parents=True, exist_ok=True)
              current = article_dir / 'CURRENT'
              if not current.exists() or current.read_text(encoding='utf-8').strip() != 'v1':
                  current.write_text('v1\n', encoding='utf-8')

          # Full QA is calculated from manifests, never from a hard-coded article count.
          actual_v1 = {
              p.as_posix(): p for p in batches_root.glob('batch_*/articles/*/versions/v1.md')
          }
          actual_current = list(batches_root.glob('batch_*/articles/*/CURRENT'))
          actual_set = set(actual_v1)
          missing = sorted(expected_set - actual_set)
          unexpected_versions = sorted(actual_set - expected_set)
          if unexpected_versions:
              version_errors.extend(f'unregistered v1 file: {p}' for p in unexpected_versions)

          for rel_path in sorted(expected_set & actual_set):
              p = actual_v1[rel_path]
              text = p.read_text(encoding='utf-8')
              if not complete_article(text):
                  content_errors.append(f'{rel_path}: final v1 content incomplete')
              current = p.parent.parent / 'CURRENT'
              if not current.exists():
                  version_errors.append(f'{current.as_posix()}: missing CURRENT')
              elif current.read_text(encoding='utf-8').strip() != 'v1':
                  version_errors.append(f'{current.as_posix()}: CURRENT must equal v1')

          current_paths = {p.parent.as_posix() for p in actual_current}
          expected_article_dirs = {str(Path(p).parent.parent) for p in expected_set}
          missing_current = sorted(expected_article_dirs - current_paths)
          extra_current = sorted(current_paths - expected_article_dirs)
          version_errors.extend(f'missing CURRENT: {p}' for p in missing_current)
          version_errors.extend(f'unregistered CURRENT: {p}' for p in extra_current)

          retry_queue = 0
          retry_candidates = []
          for pattern in ('**/retry_queue.json', '**/retry_queue.jsonl', '**/RETRY_QUEUE'):
              retry_candidates.extend(Path('.').glob(pattern))
          for p in retry_candidates:
              try:
                  raw = p.read_text(encoding='utf-8').strip()
                  if not raw:
                      continue
                  if p.suffix == '.json':
                      data = json.loads(raw)
                      retry_queue += len(data) if isinstance(data, list) else int(bool(data))
                  else:
                      retry_queue += sum(1 for line in raw.splitlines() if line.strip())
              except Exception:
                  retry_queue += 1

          qa = {
              'status': 'PASS' if not (missing or retry_queue or manifest_errors or version_errors or content_errors) else 'FAIL',
              'manifest_batches': len(manifests),
              'manifest_articles': len(expected_set),
              'imported_now': imported_now,
              'replaced_provisional': replaced_provisional,
              'unchanged_complete': unchanged_complete,
              'v1_files': len(actual_set),
              'current_pointers': len(actual_current),
              'missing': missing,
              'retry_queue': retry_queue,
              'manifest_errors': manifest_errors,
              'version_errors': version_errors,
              'content_errors': content_errors,
          }

          reports_dir = Path('reports')
          reports_dir.mkdir(parents=True, exist_ok=True)
          report = json.dumps(qa, ensure_ascii=False, indent=2) + '\n'
          reports_dir.joinpath('historical_migration_qa.json').write_text(report, encoding='utf-8')
          Path('.migration/IMPORT_RESULT.json').write_text(report, encoding='utf-8')

          if qa['status'] != 'PASS':
              raise SystemExit(
                  'QA failed: '
                  f"missing={len(missing)}, retry_queue={retry_queue}, "
                  f"manifest_errors={len(manifest_errors)}, "
                  f"version_errors={len(version_errors)}, content_errors={len(content_errors)}"
              )

      - name: Commit imported article versions and QA
        run: |
          git config user.name "AutoBridge Content Bot"
          git config user.email "actions@users.noreply.github.com"
          git add batches reports .migration/IMPORT_RESULT.json
          git rm -r .migration/pack .migration/PROCESS
          git commit -m "Import all registered historical article v1 files and pass QA"
          git push
