<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img"><title>Three connected boxes show key inventory, function verification and resolution of missing keys.</title><rect width="1200" height="500" fill="#f8fafc"/><rect x="50" y="175" width="320" height="150" rx="18" fill="#0e7490"/><text x="210" y="260" text-anchor="middle" fill="white" font-size="25" font-family="sans-serif">Inventory the keys</text><path d="M382 250 h42 m-12 -10 12 10 -12 10" fill="none" stroke="#64748b" stroke-width="5"/><rect x="440" y="175" width="320" height="150" rx="18" fill="#0f766e"/><text x="600" y="260" text-anchor="middle" fill="white" font-size="25" font-family="sans-serif">Verify each function</text><path d="M772 250 h42 m-12 -10 12 10 -12 10" fill="none" stroke="#64748b" stroke-width="5"/><rect x="830" y="175" width="320" height="150" rx="18" fill="#334155"/><text x="990" y="260" text-anchor="middle" fill="white" font-size="25" font-family="sans-serif">Resolve missing keys</text></svg>