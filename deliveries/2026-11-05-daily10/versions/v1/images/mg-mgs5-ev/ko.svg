<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="세 카드가 MGS5 EV 트림별 배터리 용량과 WLTP 주행거리를 비교합니다."><rect width="1200" height="500" fill="#f1f5f9"/><g font-family="sans-serif" text-anchor="middle" fill="#123047"><text x="600" y="56" font-size="30">MGS5 EV</text><text x="600" y="98" font-size="23">영국 · 2025년 10월</text><rect x="30" y="145" width="360" height="195" rx="18" fill="#ffffff" stroke="#91a7b8"/><text x="210" y="194" font-size="24">SE Standard Range</text><text x="210" y="251" font-size="32">49 kWh</text><text x="210" y="299" font-size="25">340 km WLTP</text><rect x="420" y="145" width="360" height="195" rx="18" fill="#ffffff" stroke="#91a7b8"/><text x="600" y="194" font-size="24">SE Long Range</text><text x="600" y="251" font-size="32">64 kWh</text><text x="600" y="299" font-size="25">480 km WLTP</text><rect x="810" y="145" width="360" height="195" rx="18" fill="#ffffff" stroke="#91a7b8"/><text x="990" y="194" font-size="24">Trophy Long Range</text><text x="990" y="251" font-size="32">64 kWh</text><text x="990" y="299" font-size="25">465 km WLTP</text><text x="600" y="416" font-size="26">주행거리와 장비로 선택</text></g></svg>