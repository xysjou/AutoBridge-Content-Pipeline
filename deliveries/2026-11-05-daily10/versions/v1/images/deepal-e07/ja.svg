<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="2枚のカードでE07の駆動方式を比較し、共通の電池容量と積載・充電の確認項目を示しています。"><rect width="1200" height="500" fill="#f0f5f3"/><g font-family="sans-serif" text-anchor="middle" fill="#123e38"><text x="600" y="48" font-size="29">Deepal E07</text><text x="600" y="89" font-size="22">豪州 · MY25 · 2026年9月</text><rect x="55" y="122" width="510" height="190" rx="18" fill="#ffffff" stroke="#8aa99a"/><text x="310" y="165" font-size="27">RWD</text><text x="310" y="219" font-size="32">252 kW</text><text x="310" y="270" font-size="26">550 km WLTP</text><rect x="635" y="122" width="510" height="190" rx="18" fill="#ffffff" stroke="#8aa99a"/><text x="890" y="165" font-size="27">AWD Performance</text><text x="890" y="219" font-size="32">440 kW</text><text x="890" y="270" font-size="26">510 km WLTP</text><text x="600" y="368" font-size="29">89.98 kWh</text><text x="600" y="431" font-size="26">積載と充電を確認</text></g></svg>