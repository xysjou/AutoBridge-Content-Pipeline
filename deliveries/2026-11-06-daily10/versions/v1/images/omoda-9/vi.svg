<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img">
<title>OMODA 9 MY26 tại Anh: chọn Noble hay Black Noble không chỉ vì ngoại hình</title>
<rect width="1200" height="780" fill="#101b2e"/>
<rect x="0" y="0" width="14" height="780" fill="#53d3bd"/>
<g font-family="Noto Sans, Noto Sans CJK SC, Noto Sans Thai, Noto Sans Arabic, sans-serif" fill="#fff">
<text x="80" y="75" text-anchor="start" direction="ltr" font-size="31">OMODA 9 MY26 tại Anh: chọn Noble hay Black Noble không</text>
<text x="80" y="117" text-anchor="start" direction="ltr" font-size="31">chỉ vì ngoại hình</text>
<rect x="70" y="225" width="1060" height="134" rx="14" fill="#21344c"/>
<circle cx="116" cy="265" r="22" fill="#53d3bd"/>
<text x="116" y="272" text-anchor="middle" fill="#101b2e" font-size="22">1</text>
<text x="160" y="273" text-anchor="start" direction="ltr" font-size="25">Tách phiên bản mới khỏi thay đổi đời xe</text>
<rect x="70" y="383" width="1060" height="134" rx="14" fill="#21344c"/>
<circle cx="116" cy="423" r="22" fill="#53d3bd"/>
<text x="116" y="430" text-anchor="middle" fill="#101b2e" font-size="22">2</text>
<text x="160" y="431" text-anchor="start" direction="ltr" font-size="25">Để khoang xe quyết định thay vì ảnh quảng cáo</text>
<rect x="70" y="541" width="1060" height="134" rx="14" fill="#21344c"/>
<circle cx="116" cy="581" r="22" fill="#53d3bd"/>
<text x="116" y="588" text-anchor="middle" fill="#101b2e" font-size="22">3</text>
<text x="160" y="589" text-anchor="start" direction="ltr" font-size="25">Có điều chỉnh nghĩa là nên đánh giá lại, không phải</text>
<text x="160" y="623" text-anchor="start" direction="ltr" font-size="25">đã khắc phục tất cả</text>
<text x="80" y="750" font-size="20" fill="#b5c9d9">AutoBridge Export · Sơ đồ biên tập</text>
</g></svg>