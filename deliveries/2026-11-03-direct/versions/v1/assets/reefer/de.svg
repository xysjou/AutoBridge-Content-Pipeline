<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc" xml:lang="de">
<title id="title">Schaubild, das Fahrgestell, Kühlkoffer und Kühlaggregat mit einer Abnahmeakte verbindet.</title>
<desc id="desc">Eigenes Schaubild zur Verbindung von Geräteunterlagen und Abnahmeakte, kein Fahrzeugfoto und kein Testergebnis.</desc>
