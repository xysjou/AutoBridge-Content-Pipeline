<text x="560" y="468" font-family="Arial, sans-serif" font-size="30" text-anchor="middle" direction="ltr">验收档案</text>
<path d="M1072 67H1100V457H1074" fill="none" stroke="#3257a8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1072 197H1100V457H1074" fill="none" stroke="#3257a8" stroke-width="2" marker-end="url(#arrow)"/>
