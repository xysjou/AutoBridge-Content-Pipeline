<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Diagram linking the named X5 PLUS configuration, vehicle documents and buyer checks.</title>
<desc id="desc">An editorial diagram of the document checks; not a vehicle photograph or test result.</desc>
<rect width="100%" height="100%" fill="#f4f7fc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3257a8"/></marker></defs>
<rect x="50" y="25" width="1020" height="85" rx="12" fill="white" stroke="#3257a8" stroke-width="2"/>
<text x="560" y="78" font-family="Arial, sans-serif" font-size="30" text-anchor="middle" direction="ltr">Exact configuration</text>
<path d="M560 115V144" fill="none" stroke="#3257a8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="50" y="155" width="1020" height="85" rx="12" fill="white" stroke="#3257a8" stroke-width="2"/>
<text x="560" y="208" font-family="Arial, sans-serif" font-size="30" text-anchor="middle" direction="ltr">Vehicle documents</text>
<path d="M560 245V274" fill="none" stroke="#3257a8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="50" y="285" width="1020" height="85" rx="12" fill="white" stroke="#3257a8" stroke-width="2"/>
<text x="560" y="338" font-family="Arial, sans-serif" font-size="30" text-anchor="middle" direction="ltr">Buyer checks</text>
</svg>
