<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" xml:lang="de" role="img" aria-labelledby="title desc">
<title id="title">Originales redaktionelles Diagramm: Batterieidentität, Lager- und Testnachweis, Entladungsursache geklärt. Kein Fahrzeugfoto, keine maßstäbliche Zeichnung und kein Prüfergebnis.</title><desc id="desc">Illustrativer Kaufablauf; kein konkretes Fahrzeug wurde geprüft.</desc>
