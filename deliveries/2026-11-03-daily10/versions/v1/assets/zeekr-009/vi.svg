<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" xml:lang="vi" role="img" aria-labelledby="title desc">
<title id="title">Sơ đồ biên tập minh họa: Quãng đường Executive, Tham chiếu Luxury bảy chỗ, Tham chiếu Ultra-Luxury sáu chỗ. Không phải ảnh xe, bản vẽ theo tỉ lệ, kết quả kiểm tra hay hướng dẫn sửa.</title><desc id="desc">Khung minh họa cho việc mua xe; chưa kiểm tra chiếc xe cụ thể nào.</desc>
