<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">독창적인 설명 도표에 수리 사건, 제조사 절차, 기록된 결과 항목을 표시합니다. 차량 사진, 점검 결과, 수리 지침이 아닙니다.</title><desc id="desc">구매 판단 설명도이며 특정 차량을 점검하지 않았습니다.</desc>
<rect width="100%" height="100%" fill="#f4f7fc"/>
<rect x="50" y="25" width="1300" height="110" rx="16" fill="white" stroke="#3257a8" stroke-width="2"/>
<text x="700" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" direction="ltr">수리 사건</text>
<rect x="50" y="170" width="1300" height="110" rx="16" fill="white" stroke="#3257a8" stroke-width="2"/>
<text x="700" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" direction="ltr">제조사 절차</text>
<rect x="50" y="315" width="1300" height="110" rx="16" fill="white" stroke="#3257a8" stroke-width="2"/>
<text x="700" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" direction="ltr">기록된 결과</text>
</svg>
