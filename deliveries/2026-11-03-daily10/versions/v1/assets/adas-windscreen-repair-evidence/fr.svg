<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" xml:lang="fr" role="img" aria-labelledby="title desc">
<title id="title">Schéma éditorial original : Remplacement du vitrage, Procédure constructeur, Résultat documenté. Ni photo de véhicule, ni dessin à l’échelle, ni résultat d’inspection.</title><desc id="desc">Cadre d’achat illustratif ; aucun véhicule précis n’a été inspecté.</desc>
