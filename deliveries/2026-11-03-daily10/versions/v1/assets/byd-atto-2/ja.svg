<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" xml:lang="ja" role="img" aria-labelledby="title desc">
<title id="title">独自の模式図でトルコBoost、トルコComfort、共通の電池仕様を示します。車両写真、縮尺図、点検結果、修理指示ではありません。</title><desc id="desc">購入判断の模式図であり、特定車両の点検は行っていません。</desc>
<rect width="100%" height="100%" fill="#f4f7fc"/>
<rect x="50" y="25" width="1300" height="110" rx="16" fill="white" stroke="#3257a8" stroke-width="2"/>
<text x="700" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" direction="ltr">トルコBoost</text>
<rect x="50" y="170" width="1300" height="110" rx="16" fill="white" stroke="#3257a8" stroke-width="2"/>
<text x="700" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" direction="ltr">トルコComfort</text>
<rect x="50" y="315" width="1300" height="110" rx="16" fill="white" stroke="#3257a8" stroke-width="2"/>
<text x="700" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" direction="ltr">共通の電池仕様</text>
</svg>
