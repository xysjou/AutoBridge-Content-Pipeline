<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" xml:lang="ar" role="img" aria-labelledby="title desc">
<title id="title">رسم تحريري أصلي يوضح قاعدة البيانات المناسبة، انطباق الحملة على السيارة، أدلة المعالجة. ليس صورة سيارة أو نتيجة فحص أو تعليمات إصلاح تقنية.</title><desc id="desc">إطار توضيحي للشراء؛ لم تُفحص سيارة محددة.</desc>
<rect width="100%" height="100%" fill="#f4f7fc"/>
<rect x="50" y="25" width="1300" height="110" rx="16" fill="white" stroke="#3257a8" stroke-width="2"/>
<text x="700" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" direction="rtl">قاعدة البيانات المناسبة</text>
<rect x="50" y="170" width="1300" height="110" rx="16" fill="white" stroke="#3257a8" stroke-width="2"/>
<text x="700" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" direction="rtl">انطباق الحملة على السيارة</text>
<rect x="50" y="315" width="1300" height="110" rx="16" fill="white" stroke="#3257a8" stroke-width="2"/>
<text x="700" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" direction="rtl">أدلة المعالجة</text>
</svg>
